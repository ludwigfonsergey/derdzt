<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Дерд за Творчество</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .input-field { width: 100%; background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
    .input-field:focus { border-color: #3b82f6; }
    .tab-btn { padding: 10px 20px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; background: transparent; color: #a1a1aa; transition: all 0.2s; }
    .tab-btn.active { background: #3b82f6; color: #fff; }
    .btn-primary { background: #3b82f6; color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 99px; font-size: 0.95rem; border: none; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
    .toast { background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 0.9rem; animation: slideIn .3s; max-width: 350px; }
    .toast.error { border-color: #ef4444; } .toast.success { border-color: #10b981; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3">
                <img src="/static/dzt.jpg" class="h-12 w-12 rounded-full" onerror="this.style.display='none'">
                <span class="text-2xl font-bold">Дерд за Творчество</span>
            </a>
        </div>
        <div class="bg-[#18181b] border border-[#27272a] rounded-2xl p-8">
            <div class="flex gap-2 mb-6 bg-[#09090b] p-1 rounded-xl">
                <button id="tab-login" class="tab-btn active flex-1" onclick="switchTab('login')">Вход</button>
                <button id="tab-register" class="tab-btn flex-1" onclick="switchTab('register')">Регистрация</button>
            </div>
            <form id="auth-form">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1">Имя пользователя</label>
                        <input type="text" id="auth-username" required class="input-field" minlength="3" maxlength="30" placeholder="Ваш ник">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1">Пароль</label>
                        <input type="password" id="auth-password" required class="input-field" minlength="4" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full mt-6" id="submit-btn">Войти</button>
            </form>
            <div class="text-center mt-6">
                <a href="/" class="text-sm text-zinc-500 hover:text-zinc-300">← На главную</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        let mode = 'login';

        function showToast(msg, type='error') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        function switchTab(m) {
            mode = m;
            document.getElementById('tab-login').classList.toggle('active', m === 'login');
            document.getElementById('tab-register').classList.toggle('active', m === 'register');
            document.getElementById('submit-btn').textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
        }

        document.getElementById('auth-form').addEventListener('submit', async e => {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;
            const url = mode === 'login' ? '/api/login' : '/api/register';
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка');
                showToast(mode === 'login' ? 'Вход выполнен!' : 'Аккаунт создан!', 'success');
                setTimeout(() => location.href = '/', 700);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
